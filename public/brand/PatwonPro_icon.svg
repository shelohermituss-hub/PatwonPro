<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="55%" stop-color="#4D7C0F"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="0" y="0" width="800" height="800" rx="176" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="800" height="800" rx="176" fill="url(#innerGlow)"/>

  <!-- monogram P built from stem + open bowl (donut via evenodd) -->
  <g fill="#ffffff">
    <rect x="256" y="192" width="88" height="416" rx="44"/>
    <path fill-rule="evenodd" d="
      M 300 192
      C 430 192 522 258 522 356
      C 522 454 430 500 320 500
      L 300 500
      L 300 420
      L 320 420
      C 388 420 442 396 442 356
      C 442 314 388 272 320 272
      L 300 272
      Z"/>
  </g>

  <!-- growth accent dot -->
  <circle cx="600" cy="600" r="34" fill="#FACC15"/>
</svg>
